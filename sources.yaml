# Cinco fuentes del enunciado. Para la entrega: dejad exactamente TRES
# activas (comentad o borrad las otras dos) y documentad la elección.
#
# url fija     → data/raw/{id}.{format}
# url_template → data/raw/{id}_{iso2}.{format}
#   marcadores: {iso2} {iso3}

# Equivalencias de código: el de la fuente WB -> el del perfil mledoze
code_equivalences:
  XKX: UNK        # Kosovo

sources:
  - id: countries_profile
    name: mledoze — perfil de países
    url: https://raw.githubusercontent.com/mledoze/countries/master/countries.json
    format: json
    role: profile
    transformer: countries_profile

  - id: worldbank_gdp
    name: World Bank — PIB per cápita (NY.GDP.PCAP.CD)
    url: https://api.worldbank.org/v2/country/all/indicator/NY.GDP.PCAP.CD?format=json
    paginated: true
    per_page: 1000
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: NY.GDP.PCAP.CD
      indicator_label: GDP per capita (current US$)
      unit: USD

  - id: worldbank_pop
    name: World Bank — población total (SP.POP.TOTL)
    url: https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json
    paginated: true
    per_page: 1000
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.POP.TOTL
      indicator_label: Population, total
      unit: persons

  - id: worldbank_life
    name: World Bank — esperanza de vida al nacer (SP.DYN.LE00.IN)
    url: https://api.worldbank.org/v2/country/all/indicator/SP.DYN.LE00.IN?format=json
    paginated: true
    per_page: 1000
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.DYN.LE00.IN
      indicator_label: Life expectancy at birth, total (years)
      unit: years
