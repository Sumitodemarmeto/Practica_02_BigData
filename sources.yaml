# Cinco fuentes del enunciado. Para la entrega: dejad exactamente TRES
# activas (comentad o borrad las otras dos) y documentad la elección.
#
# url fija     → data/raw/{id}.{format}
# url_template → data/raw/{id}_{iso2}.{format}
#   marcadores: {iso2} {iso3}

# Equivalencias de código: el de la fuente WB -> el del perfil mledoze
code_equivalences:
  XKX: UNK        # Kosovo

country_criterion:
  source: countries_profile
  accept:
    independent: true
  exclude_codes: []

focus_countries: []

sources:
  - id: countries_profile
    name: mledoze — perfil de países
    url: https://raw.githubusercontent.com/mledoze/countries/master/countries.json
    format: json
    role: profile
    transformer: countries_profile

  - id: worldbank_gdp
    name: World Bank — PIB per cápita (NY.GDP.PCAP.CD)
    url: https://api.worldbank.org/v2/country/all/indicator/NY.GDP.PCAP.CD?format=json
    paginated: true
    per_page: 1000
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: NY.GDP.PCAP.CD
      indicator_label: GDP per capita (current US$)
      unit: USD

  - id: worldbank_pop
    name: World Bank — población total (SP.POP.TOTL)
    url: https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json
    paginated: true
    per_page: 1000
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.POP.TOTL
      indicator_label: Population, total
      unit: persons

  - id: worldbank_life
    name: World Bank — esperanza de vida al nacer (SP.DYN.LE00.IN)
    url: https://api.worldbank.org/v2/country/all/indicator/SP.DYN.LE00.IN?format=json
    paginated: true
    per_page: 1000
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.DYN.LE00.IN
      indicator_label: Life expectancy at birth, total (years)
      unit: years

  - id: worldbank_co2
    name: World Bank — emisiones de CO2 per cápita (EN.GHG.CO2.PC.CE.AR5)
    url: https://api.worldbank.org/v2/country/all/indicator/EN.GHG.CO2.PC.CE.AR5?format=json
    paginated: true
    per_page: 1000
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: EN.GHG.CO2.PC.CE.AR5
      indicator_label: CO2 emissions per capita (metric tons, AR5)
      unit: metric tons per capita

  - id: worldbank_internet
    name: World Bank — uso de Internet (IT.NET.USER.ZS)
    url: https://api.worldbank.org/v2/country/all/indicator/IT.NET.USER.ZS?format=json
    paginated: true
    per_page: 1000
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: IT.NET.USER.ZS
      indicator_label: Individuals using the Internet (% of population)
      unit: "% of population"

  - id: worldbank_urban
    name: World Bank — población urbana (SP.URB.TOTL.IN.ZS)
    url: https://api.worldbank.org/v2/country/all/indicator/SP.URB.TOTL.IN.ZS?format=json
    paginated: true
    per_page: 1000
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.URB.TOTL.IN.ZS
      indicator_label: Urban population (% of total population)
      unit: "% of total population"
